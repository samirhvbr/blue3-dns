name: Release

on:
  push:
    branches: [master]
    paths: [version.md]
  workflow_dispatch:
    inputs:
      backfill:
        description: Publish every version in history
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Publish the documented version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          mode=--current
          if [ "$RELEASE_BACKFILL" = "true" ]; then
            mode=--backfill
          fi
          ./tools/release.sh "$mode" --repo "$GITHUB_REPOSITORY"
